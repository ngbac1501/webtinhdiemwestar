<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Tổng Kết | WeStar Team</title>
    <meta name="description" content="Bảng điểm tổng kết các trận đấu - WeStar Team ZingSpeed Mobile">
    <link rel="icon" href="assets/images/logows.png" sizes="any">

    <!-- CSS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">

    <!-- Aurora Racing CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        /* ── Scoreboard Page — Aurora Racing ── */
        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            background-color: #04040e;
            background-image:
                radial-gradient(ellipse at 0% 0%, rgba(124,58,237,0.14) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(6,182,212,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(245,158,11,0.06) 0%, transparent 45%),
                radial-gradient(ellipse at 0% 100%, rgba(124,58,237,0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: #e8e8f5;
        }

        .neon-card {
            background: rgba(14, 14, 36, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .neon-card::before {
            content: '';
            position: absolute;
            inset: 0; border-radius: 28px; padding: 1px;
            background: linear-gradient(135deg, rgba(124,58,237,0.4), rgba(6,182,212,0.2), rgba(245,158,11,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }

        .admin-table {
            background: rgba(8, 8, 24, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(124, 58, 237, 0.12);
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        .admin-table thead {
            background: linear-gradient(90deg,
                rgba(124, 58, 237, 0.18) 0%,
                rgba(6, 182, 212, 0.08) 100%);
            border-bottom: 2px solid rgba(124, 58, 237, 0.25);
        }

        .admin-table th {
            text-align: center;
            vertical-align: middle;
            padding: 18px 16px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: #c4b5fd;
            border-bottom: 1px solid rgba(124, 58, 237, 0.15);
        }

        .admin-table tbody tr {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border-bottom: none;
        }

        .admin-table tbody tr:hover {
            background: rgba(124, 58, 237, 0.07);
            box-shadow: 0 2px 12px rgba(124, 58, 237, 0.08);
        }

        .map-score-cell-td {
            background: rgba(0, 0, 0, 0.5) !important;
            vertical-align: middle;
        }

        .map-racer-label {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .map-score-cell {
            padding: 12px 10px;
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow:
                0 0 15px rgba(124, 58, 237, 0.7),
                0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
            text-align: center;
        }

        .map-score-cell:hover {
            transform: scale(1.15);
            text-shadow: 0 0 25px rgba(167, 139, 250, 1);
        }

        @media (min-width: 768px) {
            .map-score-cell { padding: 16px; font-size: 1.5rem; }
        }

        /* ── Aurora Background ── */
        .background-effects {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }

        .grid-background {
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background-image:
                linear-gradient(rgba(124, 58, 237, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 58, 237, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 30s linear infinite;
            transform-origin: center;
        }

        @keyframes gridMove {
            0% { transform: perspective(600px) rotateX(55deg) translateY(0); }
            100% { transform: perspective(600px) rotateX(55deg) translateY(60px); }
        }

        .orbs-container { position: absolute; width: 100%; height: 100%; }

        .orb {
            position: absolute; border-radius: 50%;
            filter: blur(90px); opacity: 0.12;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, #7c3aed, transparent); top: 5%; left: 5%; }
        .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #06b6d4, transparent); top: 50%; right: 5%; animation-delay: 7s; }
        .orb-3 { width: 500px; height: 500px; background: radial-gradient(circle, #f59e0b, transparent); bottom: 5%; left: 35%; animation-delay: 14s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-25px, 25px) scale(0.95); }
        }

        .speed-lines-container { position: absolute; width: 100%; height: 100%; overflow: hidden; }

        .speed-line {
            position: absolute; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124,58,237,0.4), rgba(6,182,212,0.2), transparent);
            animation: speedLineMove 2.5s linear infinite;
        }

        @keyframes speedLineMove {
            0% { left: -100%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        .scanline {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(180deg, transparent 0%, rgba(124,58,237,0.008) 50%, transparent 100%);
            animation: scanlineMove 12s linear infinite; pointer-events: none;
        }

        @keyframes scanlineMove {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        #particles-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        .speed-particle {
            position: absolute; border-radius: 50%;
            filter: blur(1.5px);
            box-shadow: 0 0 8px currentColor;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            10% { opacity: 0.7; transform: translateY(90vh) translateX(calc(var(--dx) * 20px)) scale(1); }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh) translateX(calc(var(--dx) * 100px)) scale(0); opacity: 0; }
        }

        /* ── Loading Screen ── */
        #loading-screen { background-color: #04040e !important; }

        .loading-spinner {
            border: 3px solid rgba(124, 58, 237, 0.15);
            border-top: 3px solid #7c3aed;
            border-right: 3px solid #06b6d4;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(124,58,237,0.3);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .table-responsive-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
        }

        /* Scoreboard Widescreen Summary Bar (Image 2 style) */
        .summary-bar-container {
            background: linear-gradient(90deg, rgba(14, 14, 36, 0.95), rgba(24, 24, 60, 0.95)) !important;
            border: 2px solid rgba(0, 243, 255, 0.3) !important;
            border-radius: 50px !important;
            padding: 12px 32px !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.05) !important;
            min-height: 80px;
            width: 100%;
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
        }

        .summary-bar-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-100%);
            animation: summaryShimmer 6s infinite;
        }

        @keyframes summaryShimmer {
            100% { transform: translateX(100%); }
        }

        .summary-bar-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-width: 0;
            padding: 0 16px;
        }

        .summary-bar-player-name {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-bar-player-score {
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            line-height: 1;
            color: #22d3ee;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        .summary-bar-player-score.team-red {
            color: #ef4444 !important;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .summary-bar-player-score.team-blue {
            color: #3b82f6 !important;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .summary-bar-divider {
            width: 2px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }

        .summary-bar-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            border-left: 3px solid #10b981;
            border-right: 3px solid #06b6d4;
            padding: 8px 24px;
            transform: skewX(-12deg);
            border-radius: 8px;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            margin: 0 20px;
        }

        .summary-bar-center-inner {
            transform: skewX(12deg);
            text-align: center;
        }

        .summary-bar-round {
            font-size: 0.95rem;
            font-weight: 900;
            color: #fbbf24;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
        }

        .summary-bar-mode {
            font-size: 0.65rem;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 3px;
            display: inline-block;
        }
        /* ── BO Tab Buttons ── */
        .bo-tab-btn {
            background: rgba(30,30,60,0.7);
            color: #94a3b8;
            border: 1px solid rgba(100,116,139,0.3);
        }
        .bo-tab-btn.active {
            background: linear-gradient(135deg, rgba(6,182,212,0.25), rgba(99,102,241,0.25));
            color: #67e8f9;
            border-color: rgba(103,232,249,0.45);
            box-shadow: 0 0 14px rgba(103,232,249,0.2);
        }
        .bo-tab-btn.finished {
            background: rgba(16,185,129,0.12);
            color: #6ee7b7;
            border-color: rgba(110,231,183,0.25);
        }
        .bo-tab-btn:hover:not(.active) {
            background: rgba(103,232,249,0.08);
            color: #e2e8f0;
            border-color: rgba(103,232,249,0.2);
        }
        /* ── 1vs1 scoreboard table wrapper override ── */
        #detailed-scoreboard-1vs1-container {
            padding: 0;
        }
        #detailed-scoreboard-1vs1-container > div {
            /* cancel the parent neon-card rounded border for 1vs1 grid */
        }
        #detailed-scoreboard-1vs1-container table {
            background: transparent;
        }
        #detailed-scoreboard-1vs1-container th,
        #detailed-scoreboard-1vs1-container td {
            border: none;
        }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="background-effects">
        <div class="grid-background"></div>
        <div class="orbs-container">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        <div class="speed-lines-container"></div>
        <div class="scanline"></div>
    </div>
    <div id="particles-js"></div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50 bg-black">
        <div class="loading-spinner"></div>
        <h2 class="text-2xl font-bold text-white mt-6 font-orbitron animate__animated animate__pulse">Đang tải bảng
            điểm...</h2>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden min-h-screen">
        <header class="sticky top-0 z-30" style="background:rgba(7,7,22,0.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(124,58,237,0.15);box-shadow:0 4px 30px rgba(0,0,0,0.5);">
            <div class="w-full px-4 md:px-6 py-4 md:py-5">
                <div class="flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3 md:gap-5 flex-1 min-w-0">
                        <button onclick="window.history.back()"
                            style="display:flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:12px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.25);color:#c4b5fd;font-weight:700;transition:all 0.3s ease;gap:8px;cursor:pointer;"
                            onmouseover="this.style.background='rgba(124,58,237,0.22)';this.style.transform='translateX(-2px)';"
                            onmouseout="this.style.background='rgba(124,58,237,0.12)';this.style.transform='';">
                            <i class="fas fa-arrow-left" style="font-size:0.85rem;"></i>
                            <span class="hidden sm:inline" style="font-size:0.85rem;">Quay lại</span>
                        </button>
                        <div class="truncate">
                            <h1 style="font-family:'Orbitron',sans-serif;font-size:clamp(1rem,3vw,1.6rem);font-weight:900;text-transform:uppercase;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.05em;">
                                Bảng Điểm Tổng Kết
                            </h1>
                            <p style="color:rgba(148,163,184,0.6);font-size:0.72rem;margin-top:3px;display:flex;align-items:center;gap:6px;">
                                <i class="fas fa-trophy" style="color:#f59e0b;"></i>
                                <span>Thành tích chi tiết các trận đấu</span>
                            </p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 md:gap-4">
                        <div class="text-right hidden xs:block">
                            <div style="font-size:0.6rem;color:rgba(148,163,184,0.5);text-transform:uppercase;font-weight:700;letter-spacing:0.12em;">Cập nhật</div>
                            <div style="font-family:'Orbitron',sans-serif;font-size:0.75rem;font-weight:900;color:#a78bfa;display:flex;align-items:center;gap:6px;margin-top:2px;">
                                <span style="position:relative;display:inline-flex;width:8px;height:8px;">
                                    <span style="position:absolute;inset:0;border-radius:50%;background:rgba(167,139,250,0.6);animation:ping 1s ease infinite;"></span>
                                    <span style="position:relative;display:inline-flex;border-radius:50%;background:#a78bfa;width:8px;height:8px;"></span>
                                </span>
                                LIVE
                            </div>
                        </div>
                        <img src="assets/images/logows.png" alt="Logo" style="height:36px;width:auto;opacity:0.7;filter:drop-shadow(0 0 8px rgba(124,58,237,0.4));">
                    </div>
                </div>
            </div>
        </header>

        <main class="w-full px-4 py-8">
            <!-- BO Tab Bar (1vs1 Mode) -->
            <div id="scoreboard-bo-tab-container" class="hidden mb-4 flex items-center gap-3">
                <!-- Rendered by JS -->
            </div>

            <div class="table-responsive-wrapper animate__animated animate__fadeIn" style="border-radius:16px;border:1px solid rgba(124,58,237,0.18);box-shadow:0 15px 40px rgba(0,0,0,0.6);background:rgba(8,8,24,0.7);backdrop-filter:blur(12px);">
                <table id="detailed-scoreboard-table" class="admin-table min-w-full">
                    <thead id="detailed-scoreboard-header">
                        <!-- Header generated by JS -->
                    </thead>
                    <tbody id="detailed-scoreboard-body">
                        <!-- Body generated by JS -->
                    </tbody>
                </table>
                <div id="detailed-scoreboard-1vs1-container" class="hidden"></div>
            </div>

            <!-- Widescreen Summary Bar (Image 2 style) -->
            <div id="scoreboard-summary-bar-container" class="hidden"></div>

            <!-- Team Summary Section -->
            <div id="team-summary-container" class="hidden mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>




            <!-- Footer -->
            <div style="margin-top:48px;text-align:center;padding-top:28px;border-top:1px solid rgba(124,58,237,0.1);">
                <img src="assets/images/logows.png" alt="Logo" style="height:36px;width:auto;margin:0 auto 12px;opacity:0.3;filter:drop-shadow(0 0 8px rgba(124,58,237,0.3));display:block;">
                <p style="color:rgba(148,163,184,0.4);font-size:0.8rem;">&copy; WeStar Team 2026</p>
            </div>
        </main>
    </div>

    <!-- ==================== MODULES ==================== -->

    <!-- Particles.js Animation -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="js/modules/particles-config.js"></script>
    
    <script type="module" src="./scoreboard.js"></script>
</body>

</html>
